  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e = iso => (COUNTRIES[iso] || [iso])[0];\n\nconst state = { from:null, to:null, sports:new Set(), countries:new Set(), focus:null, sel:new Set() };\n\n// ---- filtros UI ----\nconst schips = document.getElementById('schips');\nObject.entries(SPORTS).forEach(([k,v]) => {\n  const b = document.createElement('button');\n  b.className = 'chip'; b.dataset.k = k;\n  b.innerHTML = `<span class=\"dot\" style=\"background:${v.color}\"><\u002Fspan>${v.label}`;\n  b.onclick = () => { state.sports.has(k) ? state.sports.delete(k) : state.sports.add(k); paintSportChips(); render(); };\n  schips.appendChild(b);\n});\nfunction paintSportChips(){\n  schips.querySelectorAll('.chip').forEach(b => {\n    const on = state.sports.has(b.dataset.k);\n    b.classList.toggle('on', on);\n    b.style.background = on ? SPORTS[b.dataset.k].color : '#fff';\n    b.querySelector('.dot').style.background = on ? '#fff' : SPORTS[b.dataset.k].color;\n  });\n}\n\nconst usedIso = [...new Set(EVENTS.flatMap(e => e.iso))].sort((a,b) => cname(a).localeCompare(cname(b),'es'));\nconst csel = document.getElementById('csel');\nusedIso.forEach(iso => { const o = document.createElement('option'); o.value = iso; o.textContent = cname(iso); csel.appendChild(o); });\ncsel.onchange = () => { if (csel.value) { state.countries.add(csel.value); csel.value = ''; render(); } };\n\ndocument.getElementById('from').onchange = e => { state.from = e.target.value || null; render(); };\ndocument.getElementById('to').onchange = e => { state.to = e.target.value || null; render(); };\ndocument.getElementById('reset').onclick = () => {\n  state.from = state.to = state.focus = null; state.sports.clear(); state.countries.clear(); state.sel.clear();\n  document.getElementById('from').value = ''; document.getElementById('to').value = '';\n  paintSportChips(); render(); resetZoom();\n};\n\nconst legend = document.getElementById('legend');\nlegend.innerHTML = Object.values(SPORTS).map(s => `<div><i style=\"background:${s.color}\"><\u002Fi>${s.label}<\u002Fdiv>`).join('');\n\n// ---- filtrado ----\nfunction filtered(){\n  const f = state.from ? pd(state.from) : null, t = state.to ? pd(state.to) : null;\n  return EVENTS.filter(e => {\n    if (state.sports.size && !state.sports.has(e.sport)) return false;\n    if (state.countries.size && !e.iso.some(i => state.countries.has(i))) return false;\n    if (e.days) {\n      if (!f && !t) return true;\n      return e.days.some(d => (!f || pd(d) >= f) && (!t || pd(d) <= t));\n    }\n    if (f && pd(e.end) < f) return false;\n    if (t && pd(e.start) > t) return false;\n    return true;\n  }).sort((a,b) => a.start.localeCompare(b.start));\n}\n\n// ---- mapa ----\nconst svg = d3.select('#map'), wrap = document.getElementById('mapwrap');\nconst gRoot = svg.append('g'), gLand = gRoot.append('g'), gPins = gRoot.append('g');\nconst tip = document.getElementById('tip');\nlet projection, path, land = null, zoom, W = 0, H = 0;\n\nfunction size(){\n  W = wrap.clientWidth; H = wrap.clientHeight;\n  svg.attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);\n  projection = d3.geoNaturalEarth1().fitExtent([[8,8],[W-8,H-8]], {type:'Sphere'});\n  path = d3.geoPath(projection);\n}\nzoom = d3.zoom().scaleExtent([1,9]).on('zoom', ev => {\n  gRoot.attr('transform', ev.transform);\n  gLand.attr('stroke-width', .5 / ev.transform.k);\n  gPins.selectAll('.pin').attr('transform', d => {\n    const p = projection([d.lon, d.lat]);\n    return `translate(${p[0]},${p[1]}) scale(${1/Math.sqrt(ev.transform.k)})`;\n  });\n});\nsvg.call(zoom).on('dblclick.zoom', null);\ndocument.getElementById('zin').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.6);\ndocument.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, .625);\ndocument.getElementById('zrst').onclick = resetZoom;\nfunction resetZoom(){ svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity); }\n\nreadUrl();\nd3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {\n  land = topojson.feature(topo, topo.objects.countries).features;\n  size(); drawLand(); render();\n  document.getElementById('loading').style.display = 'none';\n}).catch(() => {\n  document.getElementById('loading').innerHTML =\n    '<div style=\"text-align:center;line-height:1.6\">No se ha podido cargar la geografía del mapa.<br><span style=\"font-weight:600\">El listado de eventos y los filtros siguen funcionando.<\u002Fspan><\u002Fdiv>';\n  size(); render();\n});\n\nconst isoById = {};\nObject.entries(COUNTRIES).forEach(([iso,[,id]]) => { if (id) isoById[id] = iso; });\n\nfunction drawLand(){\n  gLand.selectAll('path').data(land, d => d.id).join('path')\n    .attr('class','land').attr('d', path)\n    .on('click', (ev,d) => {\n      const iso = isoById[+d.id]; if (!iso || !usedIso.includes(iso)) return;\n      state.countries.has(iso) ? state.countries.delete(iso) : state.countries.add(iso);\n      render();\n    })\n    .on('mousemove', (ev,d) => {\n      const iso = isoById[+d.id];\n      const n = iso ? filtered().filter(e => e.iso.includes(iso)).length : 0;\n      if (!iso || !usedIso.includes(iso)) { tip.style.opacity = 0; return; }\n      showTip(ev, `<b>${cname(iso)}<\u002Fb><br>${n} evento${n===1?'':'s'} en el rango`);\n      d3.select(ev.currentTarget).classed('hover', true);\n    })\n    .on('mouseleave', (ev) => { tip.style.opacity = 0; d3.select(ev.currentTarget).classed('hover', false); });\n}\nfunction showTip(ev, html){\n  const r = wrap.getBoundingClientRect();\n  tip.innerHTML = html; tip.style.opacity = 1;\n  tip.style.left = Math.min(ev.clientX - r.left + 12, r.width - 232) + 'px';\n  tip.style.top = (ev.clientY - r.top + 12) + 'px';\n}\n\nfunction drawPins(evs){\n  const byLoc = d3.groups(evs, e => e.lat + ',' + e.lon).map(([k, list]) => {\n    const top = d3.greatest(d3.groups(list, e => e.sport), g => g[1].length);\n    return { key:k, lat:list[0].lat, lon:list[0].lon, list, color:SPORTS[top[0]].color, city:list[0].city };\n  });\n  const k = d3.zoomTransform(svg.node()).k;\n  gPins.selectAll('.pin').data(byLoc, d => d.key).join(\n    enter => {\n      const g = enter.append('g').attr('class','pin');\n      g.append('circle'); g.append('text').attr('dy',3.2);\n      return g;\n    })\n    .attr('transform', d => { const p = projection([d.lon, d.lat]); return `translate(${p[0]},${p[1]}) scale(${1/Math.sqrt(k)})`; })\n    .each(function(d){\n      const r = Math.min(16, 6 + Math.sqrt(d.list.length) * 2.6);\n      d3.select(this).select('circle').attr('r', r).attr('fill', d.color).attr('fill-opacity', .92);\n      d3.select(this).select('text').text(d.list.length > 1 ? d.list.length : '');\n    })\n    .on('mousemove', (ev,d) => showTip(ev, `<b>${d.city}<\u002Fb><br>${d.list.length} evento${d.list.length===1?'':'s'}<br><span style=\"opacity:.7\">clic para ver la lista<\u002Fspan>`))\n    .on('mouseleave', () => tip.style.opacity = 0)\n    .on('click', (ev,d) => { state.focus = state.focus === d.key ? null : d.key; render(); });\n}\n\n// ---- panel ----\nfunction drawList(evs){\n  const list = document.getElementById('list');\n  const shown = state.focus ? evs.filter(e => e.lat + ',' + e.lon === state.focus) : evs;\n  document.getElementById('atitle').textContent = state.focus ? shown[0]?.city || 'Eventos' : 'Eventos en el rango';\n  document.getElementById('asub').textContent = state.focus ? 'clic en el pin para quitar el foco' : `${shown.length} en total`;\n  if (shown.length === 1 && !state.focus) document.getElementById('asub').textContent = '1 en total';\n  if (!shown.length) {\n    list.innerHTML = `<div class=\"empty\">No hay eventos con estos filtros.<br>Prueba a ampliar las fechas o quitar países.<\u002Fdiv>`;\n    return;\n  }\n  let html = '', lastKey = '';\n  shown.forEach(e => {\n    const d = pd(e.start), key = d.getFullYear() + '-' + d.getMonth();\n    if (key !== lastKey) { html += `<div class=\"mgroup\">${MESL[d.getMonth()]} ${d.getFullYear()}<\u002Fdiv>`; lastKey = key; }\n    html += `<div class=\"card${state.sel.has(e.id) ? ' picked' : ''}\" data-id=\"${e.id}\" style=\"border-left-color:${e.color}\">\n      <label class=\"pick\"><input type=\"checkbox\" data-pick=\"${e.id}\"${state.sel.has(e.id) ? ' checked' : ''}><\u002Flabel>\n      ${e.logo ? `<div class=\"lg\"><img src=\"${e.logo}\" alt=\"\"><\u002Fdiv>` : `<div class=\"lg\" style=\"background:${e.color}1f\"><span style=\"width:12px;height:12px;border-radius:50%;background:${e.color};display:block\"><\u002Fspan><\u002Fdiv>`}\n      <div class=\"bd\">\n        <div class=\"nm\">${e.name}<\u002Fdiv>\n        <div class=\"dt\">${fmt(e)}${e.days ? ' <span style=\"font-weight:600;color:var(--muted)\">· solo estas noches<\u002Fspan>' : ''}<\u002Fdiv>\n        <div class=\"pl\"><img src=\"${flag(e.iso[0])}\" alt=\"\">${e.city} · ${e.iso.map(cname).join(' / ')}<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>`;\n  });\n  list.innerHTML = html;\n  list.querySelectorAll('input[data-pick]').forEach(cb => {\n    cb.onclick = ev => ev.stopPropagation();\n    cb.onchange = () => {\n      const id = +cb.dataset.pick;\n      cb.checked ? state.sel.add(id) : state.sel.delete(id);\n      cb.closest('.card').classList.toggle('picked', cb.checked);\n      drawQuote();\n    };\n  });\n  list.querySelectorAll('.card').forEach(c => c.onclick = () => {\n    const e = EVENTS[+c.dataset.id];\n    const p = projection([e.lon, e.lat]);\n    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(W/2 - p[0]*3.2, H/2 - p[1]*3.2).scale(3.2));\n  });\n}\n\nfunction drawCountryChips(){\n  const box = document.getElementById('cchips');\n  box.innerHTML = [...state.countries].map(iso =>\n    `<span class=\"cchip\" data-iso=\"${iso}\"><img src=\"${flag(iso)}\" alt=\"\">${cname(iso)}<b>×<\u002Fb><\u002Fspan>`).join('');\n  box.querySelectorAll('.cchip').forEach(c => c.onclick = () => { state.countries.delete(c.dataset.iso); render(); });\n}\n\nfunction drawQuote(){\n  const n = state.sel.size;\n  const qn = document.getElementById('qn'), btn = document.getElementById('qbtn');\n  btn.disabled = n === 0;\n  qn.innerHTML = n === 0\n    ? 'Ningún evento seleccionado<small>Marca las casillas de los eventos que interesan al cliente<\u002Fsmall>'\n    : `${n} ${n === 1 ? 'evento seleccionado' : 'eventos seleccionados'}<small><a href=\"#\" id=\"qclr\" style=\"color:var(--gold-deep);font-weight:700\">quitar selección<\u002Fa><\u002Fsmall>`;\n  const clr = document.getElementById('qclr');\n  if (clr) clr.onclick = ev => { ev.preventDefault(); state.sel.clear(); render(); };\n}\n\nfunction mailtoCotizacion(){\n  const evs = EVENTS.filter(e => state.sel.has(e.id));\n  const asunto = evs.length === 1\n    ? `Solicitud de cotización — ${evs[0].name}`\n    : `Solicitud de cotización — ${evs.length} eventos (${evs[0].start.slice(0,4)}${evs[0].start.slice(0,4) !== evs[evs.length-1].start.slice(0,4) ? '–' + evs[evs.length-1].start.slice(0,4) : ''})`;\n  const lineas = evs.map(e => `- ${e.name}\\n  Fechas: ${fmt(e)}\\n  Sede: ${e.city} (${e.iso.map(cname).join(' / ')})`).join('\\n\\n');\n  const rango = state.from || state.to\n    ? `Ventana de viaje consultada: ${state.from ? pd(state.from).toLocaleDateString('es-ES') : 'sin inicio'} a ${state.to ? pd(state.to).toLocaleDateString('es-ES') : 'sin fin'}\\n`\n    : '';\n  const cuerpo = `Hola José,\\n\\nQueremos cotizar los siguientes eventos para nuestros clientes:\\n\\n${lineas}\\n\\n${rango}Datos de la solicitud:\\n- Agencia: \\n- Persona de contacto: \\n- Teléfono: \\n- Número de pasajeros: \\n- Categoría de hospitality deseada: \\n- Necesitan vuelos y hotel: sí / no\\n- Comentarios: \\n\\nGracias,\\n`;\n  return `mailto:jose.cuervo@ticketworldonline.com?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;\n}\ndocument.getElementById('qbtn').onclick = async () => {\n  if (!state.sel.size) return;\n  const url = mailtoCotizacion();\n  if (url.length < 1800) { window.location.href = url; return; }\n  const evs = EVENTS.filter(e => state.sel.has(e.id));\n  const txt = evs.map(e => `- ${e.name} · ${fmt(e)} · ${e.city}`).join('\\n');\n  try {\n    await navigator.clipboard.writeText(txt);\n    alert('Has seleccionado ' + evs.length + ' eventos: demasiados para abrir el correo automáticamente.\\n\\nLa lista se ha copiado al portapapeles. Pégala en un correo a jose.cuervo@ticketworldonline.com.');\n  } catch {\n    window.location.href = 'mailto:jose.cuervo@ticketworldonline.com?subject=' + encodeURIComponent('Solicitud de cotización — ' + evs.length + ' eventos');\n  }\n};\n\nfunction writeUrl(){\n  const p = new URLSearchParams();\n  if (state.from) p.set('d', state.from);\n  if (state.to) p.set('h', state.to);\n  if (state.sports.size) p.set('s', [...state.sports].join(','));\n  if (state.countries.size) p.set('p', [...state.countries].join(','));\n  const q = p.toString();\n  history.replaceState(null, '', q ? '?' + q : location.pathname);\n}\nfunction readUrl(){\n  const p = new URLSearchParams(location.search);\n  const d = p.get('d'), t = p.get('h');\n  if (d) { state.from = d; document.getElementById('from').value = d; }\n  if (t) { state.to = t; document.getElementById('to').value = t; }\n  (p.get('s') || '').split(',').filter(x => SPORTS[x]).forEach(x => state.sports.add(x));\n  (p.get('p') || '').split(',').filter(x => COUNTRIES[x]).forEach(x => state.countries.add(x));\n  paintSportChips();\n}\ndocument.getElementById('share').onclick = async () => {\n  const btn = document.getElementById('share');\n  try { await navigator.clipboard.writeText(location.href); btn.textContent = 'Enlace copiado'; }\n  catch { btn.textContent = location.href; }\n  setTimeout(() => btn.textContent = 'Compartir búsqueda', 2200);\n};\n\nfunction render(){\n  const evs = filtered();\n  writeUrl();\n  if (land) {\n    const withEv = new Set(evs.flatMap(e => e.iso));\n    gLand.selectAll('path')\n      .classed('has', d => withEv.has(isoById[+d.id]))\n      .classed('sel', d => state.countries.has(isoById[+d.id]));\n    drawPins(evs);\n  }\n  drawCountryChips();\n  drawList(evs);\n  drawQuote();\n  const c = document.getElementById('count');\n  const paises = new Set(evs.flatMap(e => e.iso)).size;\n  c.innerHTML = `<em>${evs.length}<\u002Fem> ${evs.length === 1 ? 'evento' : 'eventos'} · <em>${paises}<\u002Fem> ${paises === 1 ? 'país' : 'países'}`;\n}\n\nwindow.addEventListener('resize', () => { if (!land) return; size(); gLand.selectAll('path').attr('d', path); render(); });\npaintSportChips();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
</script>
